name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main  # Əgər əsas budağınızın adı 'master'-dirsə, bura master yazın

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install and Build
        run: |
          npm ci
          npm run build

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # Vite istifadə etdiyiniz üçün bura dist qalır
          branch: gh-pages
